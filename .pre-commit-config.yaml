exclude: ^lineage/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (locked project environment)
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format (locked project environment)
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (locked project environment)
        entry: uv run --locked mypy --strict src
        language: system
        pass_filenames: false
        files: ^src/
      - id: no-silent-except
        name: ban silent except:pass
        entry: uv run --locked python scripts/check_no_silent_except.py
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
      # Runs the store-integrity and vault-drift gates where the data lives.
      # On a machine without a store it skips loudly and passes; with one, it
      # fails hard on damage or drift. That is the point: the CI twins of this
      # check run where no store exists and can only ever skip.
      - id: doctor-gate
        name: store health gate (cairntir doctor --gate)
        entry: uv run --locked python -m cairntir doctor --gate
        language: system
        pass_filenames: false
