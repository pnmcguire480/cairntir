site_name: Cairntir
site_description: Local-first, persistent memory shared by AI coding agents through MCP.
site_url: https://pnmcguire480.github.io/cairntir/
repo_url: https://github.com/pnmcguire480/cairntir
repo_name: pnmcguire480/cairntir
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Getting Started: how-to-use.md
  - Concepts: concept.md
  - Architecture: architecture/multi-host-continuity.md
  - Integration: integration-guide.md
  - Roadmap: roadmap.md
  - Recipes:
      - Bounded Hotfix: recipes/bounded-hotfix/README.md
      - Finalization Mode: recipes/finalization-mode/README.md
      - CodeGlass: recipes/codeglass/README.md
      - Decision Replay: recipes/decision-replay/README.md
      - Signal Reader: recipes/signal-reader/README.md
  - Maintenance:
      - Release Policy: release-cadence.md
      - Publish Checklist: publish-checklist.md
      - Deprecation Policy: deprecation-policy.md
      - Regression Contracts: landed-commitments.md
  - Releases:
      - Shipping Hardening Audit: release/hardening-2026-09-05.md
      - v1.9.0: release/v1.9.0.md
      - v1.8.0: release/v1.8.0.md
      - v1.7.1: release/v1.7.1.md
      - v1.7.0: release/v1.7.0.md
      - v1.2.0 Candidate: release/v1.2.0-rc.md
  - Principles: manifesto.md
  - Lineage:
      - BrainStormer: lineage/brainstormer.md
      - MemPalace: lineage/mempalace.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
