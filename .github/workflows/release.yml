name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to recover without moving it
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    env:
      CAIRNTIR_HOME: ${{ github.workspace }}/.cairntir/release-eval
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cairntir/release-models
      CAIRNTIR_ACCEPTANCE_MODEL_CACHE: ${{ github.workspace }}/.cairntir/release-models
      # Same interpreter CI uses. Without it uv picks the runner's system
      # Python, whose standard library contains symlinks that the Q05 tool
      # preparation correctly refuses.
      UV_PYTHON: "3.12"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Tag and version agree
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - name: Install release verification dependencies
        run: uv sync --locked --all-extras
      - name: Ruff lint and format
        run: |
          # Match CI's maintained code scope; frozen acceptance source under
          # plans/ is hash-preserved and executed by the normal test wrappers.
          uv run ruff check src tests scripts addons
          uv run ruff format --check src tests scripts addons
      - name: Mypy strict
        run: uv run mypy --strict src
      - name: Provision evaluation models and isolated corpus
        run: uv run python scripts/provision_eval.py --home "$CAIRNTIR_HOME"
      # The acceptance suites need the same prepared tools the CI test jobs
      # build. The v1.13.0 tag's first run had none of them and failed 69 tests
      # before publication for that reason alone.
      - name: Fetch exact Q07 inputs before offline tests
        run: uv run --no-sync python -B scripts/fetch_ci_wheels.py --output "${{ runner.temp }}/q07-wheels"
      - name: Prepare actual Q05 tools and offline build
        run: uv run --no-sync python -B -X pycache_prefix="${{ runner.temp }}/q05-prep-bytecache" scripts/provision_q05.py --output "${{ runner.temp }}/q05-tools"
      - name: Prepare actual Python verification tools
        run: uv run --no-sync python -I -B tests/acceptance/paladin_python_real_unit/prepare.py --output "${{ runner.temp }}/python-tools" --q05-platform "${{ runner.temp }}/q05-tools/platform.json" --repo "${{ github.workspace }}"
      - name: Tests and coverage
        # PyPI cannot contain this version until the publish job below. The
        # one self-referential integration test runs after trusted publishing.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          CAIRNTIR_Q05_PLATFORM: ${{ runner.temp }}/q05-tools/platform.json
          CAIRNTIR_PALADIN_PLATFORM: ${{ runner.temp }}/python-tools/platform.json
          CAIRNTIR_Q07_WHEELHOUSE: ${{ runner.temp }}/q07-wheels
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/q05-test-bytecache
        run: uv run --no-sync python -X pycache_prefix="${{ runner.temp }}/q05-test-bytecache" -m pytest -q -k "not test_every_released_changelog_version_is_tagged"
      - name: No silent exceptions
        run: uv run python scripts/check_no_silent_except.py
      - name: Every planned commitment landed
        run: uv run python scripts/check_landed_commitments.py
      - name: Locked dependency advisories
        run: uv run python scripts/check_dependency_advisories.py
      - name: Strict documentation build
        run: uv run mkdocs build --strict

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build distributions
        run: uv build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/cairntir
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  verify-published:
    name: Verify PyPI publication
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Every changelogged tag reached PyPI
        run: |
          for attempt in {1..12}; do
            if python scripts/check_release_tags.py; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            echo "PyPI index has not propagated yet; retrying in 10 seconds."
            sleep 10
          done

  github-release:
    name: GitHub Release
    needs: [build, verify-published]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
