name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Ruff check
        run: uv run ruff check src tests scripts
      - name: Ruff format check
        run: uv run ruff format --check src tests scripts
      - name: Mypy strict
        run: uv run mypy --strict src
      - name: No silent except check
        run: uv run python scripts/check_no_silent_except.py
      - name: Release tag check
        run: uv run python scripts/check_release_tags.py
      - name: Landed commitment check
        run: uv run python scripts/check_landed_commitments.py
      - name: Seam check
        run: uv run python scripts/check_seams.py
      # Honest about its own reach: the skip is in the step NAME, not in a log
      # line nobody reads. The real gate runs where the data lives —
      # `cairntir doctor --gate` (pre-commit, local, self-hosted). The rules
      # themselves are shared: one implementation in src/cairntir/health.py.
      - name: Store integrity check (SKIP on hosted runners - no store here)
        run: uv run python scripts/check_store_health.py
      # Honest about its own reach: a GitHub-hosted runner has no Obsidian vault
      # and no store, so this step cannot fail here and does not pretend to. It
      # fires on a self-hosted runner or locally, where CAIRNTIR_VAULT is real.
      # The gate's *behaviour* — exit 1 when a vault walkthrough has no drawer —
      # is proven on every CI run by tests/unit/test_vault_sync.py and
      # tests/unit/test_doctor.py.
      - name: Vault drift check (SKIP on hosted runners - no vault here)
        run: |
          if [ -n "${CAIRNTIR_VAULT:-}" ]; then
            uv run cairntir vault-sync --check
          else
            echo "SKIP: CAIRNTIR_VAULT is unset; a hosted runner has no vault to compare."
            echo "Enforcement of this gate on CI is tests/unit/test_vault_sync.py."
          fi

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest -m "not slow" --cov-fail-under=80

  eval:
    name: LongMemEval R@5 Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run LongMemEval subset (R@5 >= 0.80 or fail)
        run: uv run pytest -m eval --no-cov -q

  build:
    name: Build Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Build
        run: uv build
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7
