name: Attestation compatibility smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build verification-only distributions
        run: uv build
      - name: Attest using proposed release action
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Verify signatures, exact subjects and tampering rejection
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          STORAGE_RECORD_IDS: ${{ steps.attest.outputs.storage-record-ids }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          receipt = Path("attestation-smoke-receipt")
          receipt.mkdir()
          bundle = receipt / "bundle.jsonl"
          shutil.copyfile(os.environ["BUNDLE_PATH"], bundle)
          repo, sha, ref = (os.environ[key] for key in ("GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_REF"))
          run = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
          identity = f"https://github.com/{repo}/.github/workflows/ci.yml@{ref}"
          files = sorted(path for path in Path("dist").iterdir() if path.is_file())
          artifacts = [path for path in files if path.name.endswith((".whl", ".tar.gz"))]
          assert sum(path.name.endswith(".whl") for path in artifacts) == 1
          assert sum(path.name.endswith(".tar.gz") for path in artifacts) == 1
          assert all(path in artifacts or path.name == ".gitignore" for path in files)
          subjects = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          assert os.environ["ATTESTATION_ID"]
          assert os.environ["ATTESTATION_URL"] == f"https://github.com/{repo}/attestations/{os.environ['ATTESTATION_ID']}"
          assert not os.environ["STORAGE_RECORD_IDS"], "Unexpected storage record creation"
          policy = ["--repo", repo, "--bundle", str(bundle), "--cert-identity", identity,
                    "--source-ref", ref, "--source-digest", sha, "--signer-digest", sha,
                    "--deny-self-hosted-runners", "--predicate-type", "https://slsa.dev/provenance/v1", "--format", "json"]

          def verify(path, label):
              command = ["gh", "attestation", "verify", str(path), *policy]
              result = subprocess.run(command, capture_output=True, text=True)
              (receipt / f"{label}.stdout.json").write_text(result.stdout)
              (receipt / f"{label}.stderr.txt").write_text(result.stderr)
              (receipt / f"{label}.command.json").write_text(json.dumps(command))
              return result

          for artifact in artifacts:
              result = verify(artifact, artifact.name)
              assert result.returncode == 0, result.stderr
              verified = json.loads(result.stdout)
              assert len(verified) == 1
              proof = verified[0]["verificationResult"]
              certificate = proof["signature"]["certificate"]
              assert certificate["runInvocationURI"] == run
              assert certificate["buildTrigger"] == "workflow_dispatch"
              statement = proof["statement"]
              actual = statement["subject"]
              assert len(actual) == len(subjects)
              assert {item["name"]: item["digest"]["sha256"] for item in actual} == subjects
              assert statement["predicateType"] == "https://slsa.dev/provenance/v1"
              assert statement["predicate"]["runDetails"]["metadata"]["invocationId"] == run

          copied = receipt / artifacts[0].name
          shutil.copyfile(artifacts[0], copied)
          assert verify(copied, "negative-before").returncode == 0
          with copied.open("ab") as stream:
              stream.write(b"\nintentional-attestation-negative-control\n")
          rejected = verify(copied, "negative-tampered")
          assert rejected.returncode != 0, "Changed artifact incorrectly verified"
          assert "verifying with issuer" in rejected.stderr.lower(), rejected.stderr
          shutil.copyfile(artifacts[0], copied)
          restored = verify(copied, "negative-restored")
          assert restored.returncode == 0, restored.stderr
          (receipt / "result.json").write_text(json.dumps({
              "status": "PASS", "scope": "verification-only; no package or release publication",
              "repository": repo, "source_sha": sha, "source_ref": ref, "run_url": run,
              "signer_identity": identity, "subjects": subjects,
              "action": "actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8",
              "attestation_id": os.environ["ATTESTATION_ID"], "attestation_url": os.environ["ATTESTATION_URL"],
              "storage_record_ids": [], "tampered_artifact_rejected": True,
              "unchanged_before_and_restored_after_verified": True,
              "gh_version": subprocess.check_output(["gh", "--version"], text=True),
          }, indent=2) + "\n")
          PY
      - name: Preserve verification-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-compatibility-smoke
          path: |
            dist/
            attestation-smoke-receipt/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
